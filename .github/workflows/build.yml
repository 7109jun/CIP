name: Build (Windows)

on:
  push:
    branches:
      - main
    paths:
      - "cip/cip-repo/Cargo.toml"
      - "cip/cip-repo/Cargo.lock"
      - "cip/cip-repo/src/**"
      - "cip/cip-repo/templates/**"
      - "cip/cip-repo/cip-python/**"
      - "cip/cip-repo/tests/**"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: cip/cip-repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        shell: pwsh
        run: |
          rustup default stable
          rustup update stable
          rustc -Vv
          cargo --version

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            cip\cip-repo\target
          key: windows-cargo-${{ hashFiles('cip/cip-repo/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Run tests
        shell: pwsh
        run: |
          cargo test --locked --verbose

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --locked --verbose

      - name: Smoke test the binary
        shell: pwsh
        run: |
          $bin = "target\release\cip.exe"

          if (-not (Test-Path $bin)) {
            throw "cip.exe not found at $bin"
          }

          & $bin version

          if ($LASTEXITCODE -ne 0) {
            throw "cip version failed."
          }

          & $bin help

          if ($LASTEXITCODE -ne 0) {
            throw "cip help failed."
          }

          & $bin init smoke_test_project

          if ($LASTEXITCODE -ne 0) {
            throw "cip init failed."
          }

          Push-Location smoke_test_project

          try {
            & "..\$bin" check

            if ($LASTEXITCODE -ne 0) {
              throw "cip check failed."
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload cip.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: cip-windows-x86_64
          path: cip/cip-repo/target/release/cip.exe
          if-no-files-found: error

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cip/cip-repo/target/release/cip.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
