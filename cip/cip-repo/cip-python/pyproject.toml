[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cip"
version = "0.1.0"
description = "Python API for building Chrome/Edge extensions with CIP (Chrome in Python)"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["cip*"]
