[package]
name = "cip"
version = "0.1.0"
edition = "2021"
description = "CIP (Chrome in Python) - build Chrome/Edge extensions in Python"

[[bin]]
name = "cip"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.115"
toml = "=0.8.12"
regex = "=1.10.4"
anyhow = "=1.0.82"
thiserror = "=1.0.58"
walkdir = "=2.5.0"
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
